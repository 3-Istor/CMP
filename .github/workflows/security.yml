name: security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Block fixable HIGH and CRITICAL vulnerabilities
        if: github.event_name == 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,vendor
          exit-code: "1"

      - name: Report vulnerabilities and secrets
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          skip-dirs: node_modules,vendor
          format: sarif
          output: trivy.sarif
          exit-code: "0"

      - name: Upload report
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy.sarif

  # Evidence for the RGPD Art. 30 register (cnp-docs docs/09-conformite):
  # which personal data the code handles and where it goes. A report, never a
  # gate: a new detection is for a person to classify, not a reason to block.
  bearer-privacy:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BEARER_VERSION: 2.1.3
      BEARER_SHA256: 974d4ad7bb71bc578675684d444e345e8fbad91c85557aac035406ef5cc04c68
    steps:
      - uses: actions/checkout@v7

      - name: Install Bearer CLI
        run: |
          archive="bearer_${BEARER_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/Bearer/bearer/releases/download/v${BEARER_VERSION}/${archive}"
          echo "${BEARER_SHA256}  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bearer"
          tar -xzf "$archive" -C "$RUNNER_TEMP/bearer" bearer
          echo "$RUNNER_TEMP/bearer" >> "$GITHUB_PATH"

      - name: Privacy and dataflow reports
        continue-on-error: true
        run: |
          mkdir -p bearer-reports
          for part in backend frontend; do
            for report in privacy dataflow; do
              bearer scan "$part" --report "$report" --format json \
                --output "bearer-reports/${part}-${report}.json" \
                --skip-path node_modules,tests \
                --disable-version-check --quiet --exit-code 0 || true
            done
          done

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: bearer-privacy
          path: bearer-reports/
          if-no-files-found: warn
