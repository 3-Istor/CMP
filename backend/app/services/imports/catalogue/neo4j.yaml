# Expected values of a Neo4j backing service (see mongodb.yaml). NEO4J_AUTH
# (neo4j/<password>) comes from the neo4j-auth Secret, generated by the
# platform and never written to Git.
image:
  repository: docker.io/library/neo4j
  tag: "5.26-community"
  digest: sha256:577eb43120e8688e62e753e962c47d30044ecaa95147ee5386c29f226b878008

service:
  ports:
    - name: bolt
      port: 7687
      targetPort: 7687
    - name: http
      port: 7474
      targetPort: 7474

resources:
  requests:
    cpu: 200m
    memory: 768Mi
  limits:
    cpu: "1"
    memory: 1Gi

monitoring:
  enabled: false

env:
  - name: NEO4J_AUTH
    valueFrom:
      secretKeyRef:
        name: neo4j-auth
        key: NEO4J_AUTH
  - name: NEO4J_server_memory_heap_initial__size
    value: 512m
  - name: NEO4J_server_memory_heap_max__size
    value: 512m
  - name: NEO4J_server_memory_pagecache_size
    value: 128m
  # Kubernetes injects NEO4J_PORT_7687_TCP_PORT and friends for a Service
  # named neo4j, and the image turns every NEO4J_* variable into a setting:
  # strict validation refused to start on them.
  - name: NEO4J_server_config_strict__validation_enabled
    value: "false"

workload:
  kind: StatefulSet
  probes:
    startup: {tcpSocket: {port: 7687}, periodSeconds: 10, failureThreshold: 30}
    liveness: {tcpSocket: {port: 7687}, periodSeconds: 10}
    readiness: {httpGet: {path: /, port: 7474}, periodSeconds: 5}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 7474
    runAsGroup: 7474
    fsGroup: 7474
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
  persistence:
    mountPath: /data
    size: 1Gi
