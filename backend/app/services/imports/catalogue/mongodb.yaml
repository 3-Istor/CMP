# Expected values of a MongoDB backing service, as the CMP writes them to
# cnp-projects apps/<project>/<app>/values.yaml from its catalogue (CNP-239).
# The cnp-apps ApplicationSet adds project_name, app_name, fullnameOverride,
# links, ingress.enabled and the pull secret settings on top.
image:
  repository: docker.io/library/mongo
  tag: "8.0"
  digest: sha256:d97fea17ccb8d004cd137be8dab54d70d0df11be69c9f422aefe4484c8414ab7

service:
  ports:
    - name: mongodb
      port: 27017
      targetPort: 27017

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

monitoring:
  enabled: false

workload:
  kind: StatefulSet
  probes:
    liveness: {tcpSocket: {port: 27017}, initialDelaySeconds: 20, periodSeconds: 10}
    readiness: {tcpSocket: {port: 27017}, periodSeconds: 5}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    fsGroup: 999
    seccompProfile: {type: RuntimeDefault}
  securityContext:
    allowPrivilegeEscalation: false
    capabilities: {drop: [ALL]}
  tmpDirs: [/tmp]
  persistence:
    mountPath: /data/db
    size: 1Gi
