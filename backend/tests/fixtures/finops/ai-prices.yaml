# Public prices of the models reached through the AI gateway (decision D-F8):
# AI usage is valued at the provider's paid list price even when it runs on a
# free tier or on prepaid credits. USD per million tokens, converted to EUR at
# the ECB rate of the day by the CMP. A price change is a new entry with its
# effective date; older entries stay for history.
models:
  - provider: Google
    service: Gemini API
    model: gemini-2.5-flash
    input_usd_per_mtok: 0.30
    output_usd_per_mtok: 2.50
    effective_from: "2026-01-01"
    source: https://ai.google.dev/gemini-api/docs/pricing
  - provider: Google
    service: Gemini API
    model: gemini-2.5-flash-lite
    input_usd_per_mtok: 0.10
    output_usd_per_mtok: 0.40
    effective_from: "2026-01-01"
    source: https://ai.google.dev/gemini-api/docs/pricing
  - provider: Google
    service: Gemini API
    model: gemini-3-flash-preview
    input_usd_per_mtok: 0.50
    output_usd_per_mtok: 3.00
    effective_from: "2026-01-01"
    source: https://ai.google.dev/gemini-api/docs/pricing
  - provider: Anthropic
    service: Claude API
    model: claude-haiku-5-5
    input_usd_per_mtok: 0.10
    output_usd_per_mtok: 0.50
    effective_from: "2026-01-01"
    source: https://platform.claude.com/docs/en/about-claude/pricing
  - provider: Anthropic
    service: Claude API
    model: claude-sonnet-5-5
    input_usd_per_mtok: 2.00
    output_usd_per_mtok: 10.00
    effective_from: "2026-01-01"
    source: https://platform.claude.com/docs/en/about-claude/pricing
  - provider: Anthropic
    service: Claude API
    model: claude-opus-5-5
    input_usd_per_mtok: 4.00
    output_usd_per_mtok: 20.00
    effective_from: "2026-01-01"
    source: https://platform.claude.com/docs/en/about-claude/pricing

# Models served by the homelab GPU server are valued from its energy cost
# (onprem-tco.yaml, gpu_server), not from a list price.
local_backends:
  - ollama
